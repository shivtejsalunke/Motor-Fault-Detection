[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-fault-detection"
version = "0.1.0"
description = "Leakage-aware vibration signal processing and reproducible condition-monitoring baselines"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.17.0",
  "scikit-learn==1.8.0",
  "PyYAML==6.0.3",
  "matplotlib==3.10.8",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
