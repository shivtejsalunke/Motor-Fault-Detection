# Example configuration only; adapt values to documented acquisition metadata.
seed: 17
sampling_rate_hz: 12000
window_samples: 1024
hop_samples: 1024
filter:
  enabled: true
  low_hz: 10
  high_hz: 4000
  order: 4
features:
  - rms
  - peak_to_peak
  - crest_factor
  - kurtosis_excess
  - dominant_frequency_hz
  - spectral_centroid_hz
model:
  type: random_forest
  n_estimators: 200
  max_depth: null
split:
  group_aware: true
  test_size: 0.25
